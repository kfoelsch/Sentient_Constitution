# Full regression suite on every push and pull request. Reports only: the Pages
# deploy is gated separately by `make pages-deploy-gate` in pages.yml. Once
# `make regression` is clean, consider making it a required status check on
# main (Settings -> Branches) so it blocks merges as well.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make regression
        run: make regression
