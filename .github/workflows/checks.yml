# Full regression suite on every push and pull request. Reports only: the Pages
# deploy is gated separately by `make pages-deploy-gate` in pages.yml. Once
# `make regression` is clean, consider making it a required status check on
# main (Settings -> Branches) so it blocks merges as well.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make regression
        run: make regression
      # On failure, say which audit failed and the first lines of its output, as
      # a check annotation and in the run summary, so the cause can be read
      # without downloading the full log.
      - name: Summarize failing audits
        if: failure()
        run: |
          python3 tools/audit_report.py --root . --only-failing --max-lines 8 > "$RUNNER_TEMP/audit_report.txt" || true
          cat "$RUNNER_TEMP/audit_report.txt" >> "$GITHUB_STEP_SUMMARY"
          MSG=$(head -c 3500 "$RUNNER_TEMP/audit_report.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=make regression failed::${MSG}"
